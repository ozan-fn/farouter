# Menentukan Image OS berbasis Ubuntu 24.04
image: Ubuntu2404

# Batasi trigger hanya saat push ke branch main
branches:
  only:
    - main

# Menonaktifkan pembacaan file solusi Visual Studio otomatis
build: off

# Caching folder Go modules, build cache, dan folder binary UPX kustom
cache:
  - /root/go/pkg/mod             # Cache untuk Go modules
  - /root/.cache/go-build        # Cache untuk hasil kompilasi Go
  - /root/.cache/upx             # Cache folder lokal UPX 5.2.0

# Langkah setup environment, instalasi tools dasar, kompilasi, dan kompresi
build_script:
  - go version

  # 1. Install LFTP via apt jika belum ada
  - if ! command -v lftp &> /dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lftp; fi

  # 2. Setup UPX v5.2.0 di folder cache lokal (Menggunakan rilis terbaru UPX 5.2.0)
  - |
    if [ ! -f /root/.cache/upx/upx ]; then
      mkdir -p /root/.cache/upx
      curl -sSL https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz | tar -xJ --strip-components=1 -C /root/.cache/upx
    fi
    sudo cp /root/.cache/upx/upx /usr/local/bin/upx

  # 3. Build biner Go
  - CGO_ENABLED=0 go build -ldflags="-w -s" -o farouter .

  # 4. Kompresi dengan UPX
  - upx --best --lzma farouter

# Langkah eksekusi deployment via LFTP
deploy_script:
  - |
    lftp -c "open -u $FTP_USER,$FTP_PASS $FTP_HOST; rm -f /go/farouter; put farouter -o /go/farouter; chmod 700 /go/farouter; put /dev/null -o /go/up"
